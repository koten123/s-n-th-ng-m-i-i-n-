<!DOCTYPE1 html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTC E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome cho Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header: Thanh điều hướng & Giỏ hàng -->
    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i> UTC Store
        </div>
        <div class="cart-btn" id="cartBtn">
            <i class="fa-solid fa-cart-shopping"></i> Giỏ hàng (<span id="cartCount">0</span>)
        </div>
    </header>

    <!-- Banner chính -->
    <section class="hero">
        <h1>Chào mừng đến với UTC E-Commerce</h1>
        <p>Mua sắm đồ dùng học tập và thời trang sinh viên chất lượng cao</p>
    </section>

    <!-- Danh sách sản phẩm -->
    <main class="container">
        <h2>Sản phẩm nổi bật</h2>
        <div class="product-grid" id="productGrid">
            <!-- Sản phẩm sẽ được thêm động bằng JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 UTC Web Master. Bài tập thực hành Thiết kế Web.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
